plugins { id 'com.android.application' }
android {
 namespace 'io.github.peskysa.marcogastos'
 compileSdk 36
 defaultConfig { applicationId 'io.github.peskysa.marcogastos'; minSdk 26; targetSdk 36; versionCode 2; versionName '1.0.1' }
 signingConfigs { release { storeFile file('marco-gastos.p12'); storePassword System.getenv('ANDROID_KEY_PASSWORD'); keyAlias 'marco-gastos'; keyPassword System.getenv('ANDROID_KEY_PASSWORD'); storeType 'PKCS12' } }
 buildTypes { release { signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('copyWebAssets', Copy) { from '../../dist/web'; into 'src/main/assets' }
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
